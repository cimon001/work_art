name: Add MG ESTHETIC ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - "MG-ESTHETIC-website.zip"

permissions:
  contents: write

jobs:
  add-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package MG ESTHETIC website
        run: |
          set -euo pipefail
          test ! -e MG-ESTHETIC-website.zip
          test -f MG-ESTHETIC/index.html
          zip -qr MG-ESTHETIC-website.zip MG-ESTHETIC
          test -s MG-ESTHETIC-website.zip
          unzip -t MG-ESTHETIC-website.zip >/dev/null

      - name: Commit ZIP without replacing existing files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MG-ESTHETIC-website.zip
          git commit -m "Add MG ESTHETIC website ZIP"
          git push
